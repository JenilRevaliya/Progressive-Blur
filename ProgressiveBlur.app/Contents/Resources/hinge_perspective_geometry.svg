<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHinge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#141926" />
    </linearGradient>
    <linearGradient id="laptopBaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#323a4b" />
      <stop offset="100%" stop-color="#191e28" />
    </linearGradient>
    <linearGradient id="screenUprightGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0066cc" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
    <linearGradient id="screenHalfFoldGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0066cc" />
      <stop offset="50%" stop-color="#2b59c3" />
      <stop offset="100%" stop-color="#080b12" />
    </linearGradient>
    <filter id="glowHinge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="960" height="360" rx="16" fill="url(#bgHinge)" stroke="#222b3d" stroke-width="1.5" />
  <g transform="translate(36, 32)">
    <text x="0" y="0" fill="#00d2ff" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold">Proportional Opposite Hinge Angle Geometry</text>
    <text x="0" y="20" fill="#8b9cb5" font-family="-apple-system, sans-serif" font-size="11">Physical Hinge Angle theta (90 deg to 0 deg) vs Virtual 3D Frustum Tilt phi (0 deg to 85 deg)</text>
  </g>
  <!-- State 1: 90 deg Upright -->
  <g transform="translate(60, 80)">
    <rect x="0" y="160" width="180" height="14" rx="3" fill="url(#laptopBaseGrad)" stroke="#455068" stroke-width="1.2" />
    <rect x="60" y="160" width="60" height="3" fill="#252c3c" />
    <circle cx="10" cy="176" r="2.5" fill="#12151d" />
    <circle cx="170" cy="176" r="2.5" fill="#12151d" />
    <circle cx="175" cy="160" r="6" fill="#151922" stroke="#455068" stroke-width="1" />
    <rect x="169" y="30" width="8" height="130" rx="3" fill="#262c3a" stroke="#455068" stroke-width="1.2" />
    <rect x="168" y="34" width="3" height="122" fill="url(#screenUprightGrad)" />
    <rect x="167" y="30" width="4" height="10" fill="#040508" />
    <path d="M 175 125 A 35 35 0 0 0 140 160" fill="none" stroke="#00ff88" stroke-width="2" filter="url(#glowHinge)" />
    <polygon points="140,160 148,156 148,164" fill="#00ff88" />
    <text x="120" y="145" fill="#00ff88" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">90 deg</text>
    <rect x="0" y="190" width="190" height="66" rx="8" fill="#101520" stroke="#1d2638" stroke-width="1" />
    <text x="12" y="208" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">Upright (Open)</text>
    <text x="12" y="226" fill="#00ff88" font-family="-apple-system, sans-serif" font-size="10" font-weight="semibold">theta = 90 deg | turn = 0.0</text>
    <text x="12" y="242" fill="#8b9cb5" font-family="-apple-system, sans-serif" font-size="9">Native Desktop (0% Defocus)</text>
  </g>
  <g transform="translate(295, 175)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#00d2ff" stroke-width="1.8" stroke-dasharray="4 3" />
    <polygon points="50,0 42,-4 42,4" fill="#00d2ff" />
    <text x="25" y="-10" fill="#8b9cb5" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Lid Folds</text>
  </g>
  <!-- State 2: 45 deg Half Fold -->
  <g transform="translate(385, 80)">
    <rect x="0" y="160" width="180" height="14" rx="3" fill="url(#laptopBaseGrad)" stroke="#455068" stroke-width="1.2" />
    <rect x="60" y="160" width="60" height="3" fill="#252c3c" />
    <circle cx="10" cy="176" r="2.5" fill="#12151d" />
    <circle cx="170" cy="176" r="2.5" fill="#12151d" />
    <circle cx="175" cy="160" r="6" fill="#151922" stroke="#455068" stroke-width="1" />
    <line x1="175" y1="160" x2="83" y2="68" stroke="#262c3a" stroke-width="8" stroke-linecap="round" />
    <line x1="174" y1="158" x2="84" y2="70" stroke="url(#screenHalfFoldGrad)" stroke-width="3" />
    <path d="M 175 130 A 30 30 0 0 0 154 139" fill="none" stroke="#d29922" stroke-width="2" filter="url(#glowHinge)" />
    <polygon points="154,139 160,133 162,141" fill="#d29922" />
    <text x="140" y="125" fill="#d29922" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">45 deg</text>
    <rect x="0" y="190" width="190" height="66" rx="8" fill="#101520" stroke="#1d2638" stroke-width="1" />
    <text x="12" y="208" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">Half Fold (Defocus)</text>
    <text x="12" y="226" fill="#d29922" font-family="-apple-system, sans-serif" font-size="10" font-weight="semibold">theta = 45 deg | turn = 0.5</text>
    <text x="12" y="242" fill="#00d2ff" font-family="-apple-system, sans-serif" font-size="9">Top Width: 72% | phi = 43 deg</text>
  </g>
  <g transform="translate(620, 175)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#00d2ff" stroke-width="1.8" stroke-dasharray="4 3" />
    <polygon points="50,0 42,-4 42,4" fill="#00d2ff" />
    <text x="25" y="-10" fill="#8b9cb5" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Closes</text>
  </g>
  <!-- State 3: 10 deg Closed -->
  <g transform="translate(710, 80)">
    <rect x="0" y="160" width="180" height="14" rx="3" fill="url(#laptopBaseGrad)" stroke="#455068" stroke-width="1.2" />
    <rect x="60" y="160" width="60" height="3" fill="#252c3c" />
    <circle cx="10" cy="176" r="2.5" fill="#12151d" />
    <circle cx="170" cy="176" r="2.5" fill="#12151d" />
    <circle cx="175" cy="160" r="6" fill="#151922" stroke="#455068" stroke-width="1" />
    <line x1="175" y1="160" x2="47" y2="138" stroke="#262c3a" stroke-width="8" stroke-linecap="round" />
    <line x1="174" y1="159" x2="48" y2="139" stroke="#080b12" stroke-width="3" />
    <rect x="0" y="190" width="190" height="66" rx="8" fill="#101520" stroke="#1d2638" stroke-width="1" />
    <text x="12" y="208" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">Closed (Sleep)</text>
    <text x="12" y="226" fill="#f85149" font-family="-apple-system, sans-serif" font-size="10" font-weight="semibold">theta = 10 deg | turn = 1.0</text>
    <text x="12" y="242" fill="#8b9cb5" font-family="-apple-system, sans-serif" font-size="9">Top Width: 46% | Pure Black Void</text>
  </g>
</svg>