<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="sensorBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#121824" />
      <stop offset="80%" stop-color="#080b12" />
      <stop offset="100%" stop-color="#030508" />
    </radialGradient>
    <linearGradient id="chipBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242b38" />
      <stop offset="100%" stop-color="#141822" />
    </linearGradient>
    <linearGradient id="magNorth" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e63946" />
      <stop offset="100%" stop-color="#ba181b" />
    </linearGradient>
    <linearGradient id="magSouth" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d3557" />
      <stop offset="100%" stop-color="#457b9d" />
    </linearGradient>
    <filter id="sensorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="400" rx="18" fill="url(#sensorBg)" stroke="#222b3d" stroke-width="1.5" />
  <g transform="translate(24, 28)">
    <rect x="0" y="0" width="136" height="20" rx="10" fill="#00ff88" fill-opacity="0.12" stroke="#00ff88" stroke-opacity="0.3" stroke-width="0.8" />
    <circle cx="10" cy="10" r="3" fill="#00ff88" />
    <text x="18" y="14" fill="#00ff88" font-family="-apple-system, sans-serif" font-size="9" font-weight="bold" letter-spacing="0.5">APPLE HID SENSOR</text>
    <text x="0" y="38" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold">Hall-Effect Inclinometer</text>
    <text x="0" y="52" fill="#8b9cb5" font-family="-apple-system, sans-serif" font-size="10">Device ID: 0x8104 | Page: 0x0020 | Usage: 0x008A</text>
  </g>
  <!-- Hinge Clutch & Hall Sensor Assembly -->
  <g transform="translate(200, 210)">
    <circle cx="0" cy="0" r="95" fill="#0d111a" stroke="#323b4e" stroke-width="1.5" />
    <circle cx="0" cy="0" r="82" fill="#131824" stroke="#252d3d" stroke-width="1" />
    <g transform="rotate(35)">
      <!-- North Pole -->
      <path d="M -45 -18 L 0 -18 A 18 18 0 0 1 0 18 L -45 18 Z" fill="url(#magNorth)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="0.8" />
      <text x="-25" y="5" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">N</text>
      <path d="M 0 -18 L 45 -18 A 18 18 0 0 1 45 18 L 0 18 Z" fill="url(#magSouth)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="0.8" />
      <text x="25" y="5" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">S</text>
    </g>
    <g fill="none" stroke="#00ff88" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="3 3">
      <path d="M -25 -25 C -45 -65, 45 -65, 25 -25" />
      <path d="M -35 -30 C -65 -85, 65 -85, 35 -30" />
      <path d="M -25 25 C -45 65, 45 65, 25 25" />
      <path d="M -35 30 C -65 85, 65 85, 35 30" />
    </g>
    <!-- Sensor IC 0x8104 -->
    <g transform="translate(0, 62)">
      <rect x="-35" y="10" width="70" height="24" fill="#8c581e" fill-opacity="0.4" stroke="#d4943c" stroke-width="0.8" />
      <rect x="-24" y="-12" width="48" height="24" rx="4" fill="url(#chipBodyGrad)" stroke="#00ff88" stroke-width="1.2" filter="url(#sensorGlow)" />
      <rect x="-20" y="12" width="4" height="6" fill="#d4af37" />
      <rect x="-20" y="-18" width="4" height="6" fill="#d4af37" />
      <rect x="-8" y="12" width="4" height="6" fill="#d4af37" />
      <rect x="-8" y="-18" width="4" height="6" fill="#d4af37" />
      <rect x="4" y="12" width="4" height="6" fill="#d4af37" />
      <rect x="4" y="-18" width="4" height="6" fill="#d4af37" />
      <rect x="16" y="12" width="4" height="6" fill="#d4af37" />
      <rect x="16" y="-18" width="4" height="6" fill="#d4af37" />
      <text x="0" y="4" fill="#00ff88" font-family="-apple-system, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">0x8104</text>
    </g>
  </g>
  <g transform="translate(24, 340)">
    <rect x="0" y="0" width="352" height="34" rx="8" fill="#101520" stroke="#1d2638" stroke-width="1" />
    <text x="14" y="21" fill="#8b9cb5" font-family="-apple-system, sans-serif" font-size="10">Sampling Rate: <tspan fill="#00ff88" font-weight="bold">60 Hz Live</tspan> | Accuracy: <tspan fill="#00d2ff" font-weight="bold">0.1 deg</tspan></text>
  </g>
</svg>