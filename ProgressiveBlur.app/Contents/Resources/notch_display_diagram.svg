        <rect x="20" y="-7" width="16" height="9" rx="2" fill="none" stroke="#ffffff" stroke-width="1" />
        <rect x="22" y="-5" width="11" height="5" fill="#34c759" />
        <text x="44" y="0" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="semibold">9:41</text>
      </g>
      <path d="M 14 182 Q 120 100, 220 130 T 326 90 L 326 182 Z" fill="#00d2ff" fill-opacity="0.1" />
