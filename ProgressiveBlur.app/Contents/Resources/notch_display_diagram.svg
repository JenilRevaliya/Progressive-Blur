<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="notchBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#121824" />
      <stop offset="80%" stop-color="#080b12" />
      <stop offset="100%" stop-color="#030508" />
    </radialGradient>
    <linearGradient id="lidTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d4659" />
      <stop offset="100%" stop-color="#222836" />
    </linearGradient>
    <linearGradient id="retinaScreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c2c" />
      <stop offset="100%" stop-color="#080b12" />
    </linearGradient>
    <filter id="notchGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="400" rx="18" fill="url(#notchBg)" stroke="#222b3d" stroke-width="1.5" />
  <g transform="translate(24, 28)">
