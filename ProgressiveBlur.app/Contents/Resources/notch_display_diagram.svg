    <text x="18" y="14" fill="#00d2ff" font-family="-apple-system, sans-serif" font-size="9" font-weight="bold" letter-spacing="0.5">LIQUID RETINA XDR</text>
    <text x="0" y="38" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold">Display Notch SDF Cutout</text>
    <text x="0" y="52" fill="#8b9cb5" font-family="-apple-system, sans-serif" font-size="10">Continuous Curvature G3 Squircles &amp; Optical Sensors</text>
  </g>
