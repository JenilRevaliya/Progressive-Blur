    <circle cx="170" cy="27" r="5" fill="#0c1424" stroke="#1c2d4a" stroke-width="0.8" />
    <circle cx="170" cy="27" r="2.8" fill="#122442" />
    <circle cx="170" cy="27" r="1.4" fill="#00d2ff" fill-opacity="0.9" filter="url(#notchGlow)" />
    <circle cx="152" cy="27" r="2.2" fill="#121722" stroke="#252d3d" stroke-width="0.6" />
    <circle cx="188" cy="27" r="2.0" fill="#00ff88" filter="url(#notchGlow)" />
    <!-- Callouts -->
    <line x1="170" y1="48" x2="170" y2="78" stroke="#00d2ff" stroke-width="1" stroke-dasharray="2 2" />
    <circle cx="170" cy="48" r="2" fill="#00d2ff" />
    <rect x="115" y="78" width="110" height="22" rx="5" fill="#0f1622" stroke="#00d2ff" stroke-width="0.8" />
