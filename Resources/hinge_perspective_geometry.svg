<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
  </defs>

  <rect width="800" height="240" rx="14" fill="url(#bg2)" stroke="#30363d" stroke-width="1.5" />

  <text x="30" y="36" fill="#58a6ff" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold">Proportional Opposite Hinge Angle Geometry</text>
  <text x="30" y="56" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="11">theta = Physical Hinge Angle (90 deg -> 0 deg) | phi = 3D Inside Perspective Tilt (0 deg -> 85 deg)</text>

  <!-- Left: Flat 90 deg Upright -->
  <g transform="translate(140, 75)">
    <!-- Base -->
    <rect x="-80" y="110" width="160" height="12" rx="3" fill="#21262d" stroke="#484f58" stroke-width="1.2" />
    <!-- Screen upright -->
    <line x1="0" y1="110" x2="0" y2="10" stroke="#58a6ff" stroke-width="3" />
    <!-- Angle Arc -->
    <path d="M 30 110 A 30 30 0 0 0 0 80" fill="none" stroke="#3fb950" stroke-width="1.5" />
    <text x="35" y="95" fill="#3fb950" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">90 deg</text>
    <text x="0" y="0" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Upright (Open)</text>
    <text x="0" y="138" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">turn = 0.0 | phi = 0 deg</text>
    <text x="0" y="152" fill="#58a6ff" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">Native Display (0% Blur)</text>
  </g>

  <!-- Arrow -->
  <path d="M 280 135 L 340 135" stroke="#8b949e" stroke-width="2" stroke-dasharray="4 4" />
  <text x="310" y="125" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Lid Folds</text>

  <!-- Middle: 45 deg Partial Fold -->
  <g transform="translate(420, 75)">
    <!-- Base -->
    <rect x="-80" y="110" width="160" height="12" rx="3" fill="#21262d" stroke="#484f58" stroke-width="1.2" />
    <!-- Screen 45 deg -->
    <line x1="0" y1="110" x2="-65" y2="35" stroke="#58a6ff" stroke-width="3" />
    <!-- Angle Arc -->
    <path d="M 25 110 A 25 25 0 0 0 -17 92" fill="none" stroke="#d29922" stroke-width="1.5" />
    <text x="25" y="88" fill="#d29922" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">45 deg</text>
    <text x="-65" y="25" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Half Fold</text>
    <text x="0" y="138" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">turn = 0.5 | phi = 43 deg</text>
    <text x="0" y="152" fill="#d29922" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">Top Width: 72% | Mid Defocus</text>
  </g>

  <!-- Arrow -->
  <path d="M 540 135 L 600 135" stroke="#8b949e" stroke-width="2" stroke-dasharray="4 4" />
  <text x="570" y="125" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Closes</text>

  <!-- Right: 10 deg Closed -->
  <g transform="translate(680, 75)">
    <!-- Base -->
    <rect x="-80" y="110" width="160" height="12" rx="3" fill="#21262d" stroke="#484f58" stroke-width="1.2" />
    <!-- Screen 10 deg -->
    <line x1="0" y1="110" x2="-95" y2="92" stroke="#58a6ff" stroke-width="3" />
    <text x="-95" y="80" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Closed</text>
    <text x="0" y="138" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">turn = 1.0 | phi = 85 deg</text>
    <text x="0" y="152" fill="#f85149" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">Top Width: 46% | Pure Black</text>
  </g>
</svg>
