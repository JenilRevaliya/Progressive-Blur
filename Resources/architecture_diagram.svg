<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#121824" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2434" />
      <stop offset="100%" stop-color="#141a26" />
    </linearGradient>
  </defs>

  <rect width="800" height="280" rx="16" fill="url(#bgGrad)" stroke="#223046" stroke-width="1.5" />

  <text x="30" y="38" fill="#00d2ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold">iPhone Duo Progressive Blur: System Pipeline</text>
  <text x="30" y="58" fill="#8b9bb4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Physical Sensor Input -> DSP Filtering -> GPU Metal Shaders -> Non-Activating Overlay</text>

  <rect x="30" y="85" width="160" height="150" rx="12" fill="url(#cardGrad)" stroke="#2b3b55" stroke-width="1.5" />
  <rect x="42" y="97" width="136" height="24" rx="6" fill="#0072ff" fill-opacity="0.2" />
  <text x="110" y="113" fill="#00d2ff" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PHYSICAL SENSOR</text>
  <text x="45" y="145" fill="#d0d8e5" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Apple Hall Sensor</text>
  <text x="45" y="165" fill="#8b9bb4" font-family="-apple-system, sans-serif" font-size="10">Device ID: 0x8104</text>
  <text x="45" y="183" fill="#8b9bb4" font-family="-apple-system, sans-serif" font-size="10">Page: 0x0020 (Sensor)</text>
  <text x="45" y="201" fill="#8b9bb4" font-family="-apple-system, sans-serif" font-size="10">Usage: 0x008A (Angle)</text>
  <text x="45" y="219" fill="#00ff88" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold">60 Hz Polling Rate</text>

  <path d="M 190 160 L 220 160" stroke="#00d2ff" stroke-width="2" stroke-dasharray="4 3" />
  <circle cx="220" cy="160" r="3" fill="#00d2ff" />

  <rect x="225" y="85" width="160" height="150" rx="12" fill="url(#cardGrad)" stroke="#2b3b55" stroke-width="1.5" />
  <rect x="237" y="97" width="136" height="24" rx="6" fill="#00ff88" fill-opacity="0.15" />
  <text x="305" y="113" fill="#00ff88" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">DSP FILTERING</text>
  <text x="240" y="145" fill="#d0d8e5" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Low-Latency EMA</text>
  <text x="240" y="165" fill="#8b9bb4" font-family="-apple-system, sans-serif" font-size="10">Deadband: 0.05 deg</text>
  <text x="240" y="183" fill="#8b9bb4" font-family="-apple-system, sans-serif" font-size="10">Follow Speed: 22.0</text>
  <text x="240" y="201" fill="#8b9bb4" font-family="-apple-system, sans-serif" font-size="10">Normalized: 0.0 to 1.0</text>
  <text x="240" y="219" fill="#00d2ff" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold">Strict 90 deg Boundary</text>

  <path d="M 385 160 L 415 160" stroke="#00d2ff" stroke-width="2" stroke-dasharray="4 3" />
  <circle cx="415" cy="160" r="3" fill="#00d2ff" />

  <rect x="420" y="85" width="165" height="150" rx="12" fill="url(#cardGrad)" stroke="#2b3b55" stroke-width="1.5" />
  <rect x="432" y="97" width="141" height="24" rx="6" fill="#8b5cf6" fill-opacity="0.2" />
  <text x="502" y="113" fill="#a78bfa" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">METAL SHADER GPU</text>
  <text x="435" y="145" fill="#d0d8e5" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">3D Frustum Mapping</text>
  <text x="435" y="165" fill="#8b9bb4" font-family="-apple-system, sans-serif" font-size="10">16-Sample Fermat Bokeh</text>
  <text x="435" y="183" fill="#8b9bb4" font-family="-apple-system, sans-serif" font-size="10">Top Width: 46% Taper</text>
  <text x="435" y="201" fill="#8b9bb4" font-family="-apple-system, sans-serif" font-size="10">Apple Squircle + Notch</text>
  <text x="435" y="219" fill="#a78bfa" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold">120 FPS Retina Sync</text>

  <path d="M 585 160 L 615 160" stroke="#00d2ff" stroke-width="2" stroke-dasharray="4 3" />
  <circle cx="615" cy="160" r="3" fill="#00d2ff" />

  <rect x="620" y="85" width="150" height="150" rx="12" fill="url(#cardGrad)" stroke="#2b3b55" stroke-width="1.5" />
  <rect x="632" y="97" width="126" height="24" rx="6" fill="#ec4899" fill-opacity="0.2" />
  <text x="695" y="113" fill="#f472b6" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SECURE OVERLAY</text>
  <text x="635" y="145" fill="#d0d8e5" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">NonActivatingPanel</text>
  <text x="635" y="165" fill="#8b9bb4" font-family="-apple-system, sans-serif" font-size="10">canBecomeKey = false</text>
  <text x="635" y="183" fill="#8b9bb4" font-family="-apple-system, sans-serif" font-size="10">Mouse Pass-Through</text>
  <text x="635" y="201" fill="#8b9bb4" font-family="-apple-system, sans-serif" font-size="10">Zero Password Intercept</text>
  <text x="635" y="219" fill="#00ff88" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold">Lock Screen Safe</text>
</svg>
